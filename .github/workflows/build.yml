name: App build

on: [push]

jobs:
  build:
    name: Build ${{ matrix.config.name }}${{ matrix.config.tag }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      MSVC_VERSION: C:/Program Files/Microsoft Visual Studio/2022/Enterprise
    strategy:
      matrix:
        config:
          - { name: "win64", os: windows-latest }
          - { name: "win32", os: windows-latest }
          - { name: "linux", os: ubuntu-22.04 }
          # - { name: "macos", os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.name == 'win32' && 'x86' || 'x64' }}

      - name: Install system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libgl1-mesa-dev libxkbcommon-x11-0 libxcb-*
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-11 QMAKE_CC=gcc-11 QMAKE_LINK=g++-11" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Make a release
        run: python ./share/ci/release.py

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

  release:
    name: Create release
    needs: build
    if: contains(github.ref, '/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          python -c "
          with open('share/Changelog_en.md', 'r', encoding='utf-8') as f:
              content = f.read()
          start = content.find('## 4.0.0')
          end = content.find('## 3.3.0')
          if start != -1 and end != -1:
              notes = content[start:end].strip()
          else:
              notes = 'Screen Translator v4.0.0 Release'
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          "

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
