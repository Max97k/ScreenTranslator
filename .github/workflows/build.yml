name: App build

on: [push]

jobs:
  build:
    name: Build ${{ matrix.config.name }}${{ matrix.config.tag }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      MSVC_VERSION: C:/Program Files/Microsoft Visual Studio/2022/Enterprise
    strategy:
      matrix:
        config:
          - { name: "win64", os: windows-latest }
          - { name: "win32", os: windows-latest }
          - { name: "linux", os: ubuntu-22.04 }
          # - { name: "macos", os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libgl1-mesa-dev libxkbcommon-x11-0 libxcb-*
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-11 QMAKE_CC=gcc-11 QMAKE_LINK=g++-11" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Make a release
        shell: bash
        run: |
          python ./share/ci/release.py
          echo "artifact=`python ./share/ci/release.py artifact_name`" >> $GITHUB_ENV

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

  release:
    name: Create release
    needs: build
    if: contains(github.ref, '/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
